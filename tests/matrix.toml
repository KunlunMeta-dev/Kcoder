secret_env = ["KCODER_E2E_MODEL_ENDPOINT", "KCODER_E2E_MODEL_CREDENTIAL_VALUE"]
secret_env_selectors = ["KCODER_E2E_MODEL_CREDENTIAL_ENV"]
depends_on = ["build-debug-cli"]
