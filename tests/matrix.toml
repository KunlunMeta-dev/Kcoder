[[suite]]
id = "continuous-work-unit"
tiers = ["full"]
# Continuous-work behavior is verified by plain Rust tests.
command = ["cargo", "test", "-p", "kcoder_cli", "--bin", "kcoder", "--", "continuous_work", "background"]
summary = { parser = "cargo", expected_skips = 0 }
timeout_seconds = 1800
requires_commands = ["cargo"]
pass_env = ["CARGO_HOME", "RUSTUP_HOME", "RUSTC_WRAPPER", "CC", "CXX", "PKG_CONFIG_PATH"]
env = { CARGO_NET_OFFLINE = "true" }

[[suite]]
id = "continuous-work-stdio"
tiers = ["full"]
# Real app-server processes against a controlled Provider fixture (M1 loop).
command = ["cargo", "test", "-p", "kcoder_cli", "--test", "app_server_stdio", "--", "--include-ignored", "a_failed_background_command_wakes_the_original_thread_once", "a_background_result_after_pause_does_not_wake_the_thread", "a_steer_reaches_the_next_provider_request_exactly_once", "a_recovery_does_not_redeliver_a_finished_background_job", "background_subagent_lifecycle", "m1_demo_a_goal_survives_a_failed_background_test_and_a_steer_to_completion"]
summary = { parser = "cargo", expected_skips = 0 }
timeout_seconds = 1800
requires_commands = ["cargo"]
platforms = ["linux"]
pass_env = ["CARGO_HOME", "RUSTUP_HOME", "RUSTC_WRAPPER", "CC", "CXX", "PKG_CONFIG_PATH"]
env = { CARGO_NET_OFFLINE = "true" }

