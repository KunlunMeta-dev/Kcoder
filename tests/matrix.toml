command = ["pnpm", "exec", "vitest", "run", "scripts/ai-verify.test.mjs", "scripts/ai-verify-environment.test.mjs", "src/e2e/desktop-control-keyboard.test.ts", "src/e2e/desktop-process-lifecycle.test.ts", "src/e2e/desktop-scenario-loader.test.ts", "--reporter=json"]
summary = { parser = "vitest-json", expected_skips = 0 }
timeout_seconds = 600
requires_commands = ["node", "pnpm"]
env = { pnpm_config_verify_deps_before_run = "warn" }

