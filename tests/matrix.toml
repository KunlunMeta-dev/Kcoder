# Exact Linux roster: tests/ignored-tests.linux.json; review named changes before updating.
summary = { parser = "cargo", expected_skips = { linux = 47, macos = "any", windows = "any" } }
timeout_seconds = 1800
requires_commands = ["cargo"]
pass_env = ["CARGO_HOME", "RUSTUP_HOME", "RUSTC_WRAPPER", "CC", "CXX", "PKG_CONFIG_PATH"]

