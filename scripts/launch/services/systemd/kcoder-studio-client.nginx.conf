worker_processes 1;
pid /run/kcoder-studio-client/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    # Keep request-body and proxy spill files in the unit's RuntimeDirectory,
    # which systemd creates for the service user; the distro defaults under
    # /var/lib/nginx are not writable by an unprivileged service account.
    client_body_temp_path /run/kcoder-studio-client/client_body;
    proxy_temp_path /run/kcoder-studio-client/proxy;
    fastcgi_temp_path /run/kcoder-studio-client/fastcgi;
    uwsgi_temp_path /run/kcoder-studio-client/uwsgi;
    scgi_temp_path /run/kcoder-studio-client/scgi;

    map $http_upgrade $kcoder_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Allow only localhost, private server networks, and Tailscale; do not listen on public interfaces.
        listen 127.0.0.1:4174;
        listen 4174;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:4173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $kcoder_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
