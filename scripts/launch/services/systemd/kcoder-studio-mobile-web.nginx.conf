worker_processes 1;
pid /run/kcoder-studio-mobile-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;

    map $http_upgrade $kcoder_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Allow only localhost, private server networks, and Tailscale; do not listen on public interfaces.
        listen 127.0.0.1:4175;
        listen 4175;
        server_name _;

        location ~ ^/(api(?:/|$)|rpc$|login$|logout$) {
            proxy_pass http://127.0.0.1:4173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $kcoder_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:14175;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $kcoder_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
