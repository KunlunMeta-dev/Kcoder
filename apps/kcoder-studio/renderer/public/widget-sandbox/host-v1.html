  function renderMap(declaration, topology) {

    const toolbar = document.createElement('div'); toolbar.className = 'widget-legend'; toolbar.setAttribute('role', 'toolbar'); toolbar.setAttribute('aria-label', zh ? '地图视图' : 'Map view')

  function wirePrompts() {
    for (const node of root.querySelectorAll('[data-kcoder-prompt]')) {

      node.setAttribute('tabindex', '0'); node.setAttribute('role', 'button')

      node.addEventListener('click', request)
      node.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); request() } })
    }
  }

  function wireAnimationControls() {

  function resize() {
