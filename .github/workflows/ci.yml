name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier to run"
        required: true
        default: full
        type: choice
        options:
          - full
          - real-model
          - platform
          - benchmarks
          - android
      platform_target:
        description: "Protected target to run for the platform tier"
        required: true
        type: choice
        default: linux-desktop
        options:
          - linux-desktop
          - windows-desktop
          - macos-desktop

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  relay:
    name: Multi-Gateway relay contracts
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/kcoder-relay/package-lock.json
      - name: Install locked relay and Gateway fixture dependencies
        run: |
          npm --prefix apps/kcoder-relay ci --no-audit --no-fund
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
      - name: Relay routing, registration, isolation and cleanup contracts
        run: npm --prefix apps/kcoder-relay test

  repository-tooling:
    name: Repository scripts, resources and tooling
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release helper test dependencies
        env:
          COREPACK_ENABLE_AUTO_PIN: '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
      - name: Validate all tracked support scripts
        run: python3 scripts/ci/check_repository_syntax.py
      - name: Quality gate coverage and package-manager pins
        run: python3 scripts/ci/check_quality_contracts.py
      - name: CI scanner negative and non-execution contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Documentation checker contracts
        run: python3 -m unittest discover -s scripts/docs -p 'test_*.py' -v
      - name: Full source documentation coverage and references
        if: github.repository != 'KunlunMeta-dev/Kcoder'
        run: python3 scripts/docs/check_documentation.py
      - name: Public source documentation boundary
        if: github.repository == 'KunlunMeta-dev/Kcoder'
        run: python3 scripts/docs/check_documentation.py --public-snapshot
      - name: Workflow syntax and expression checks
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Contract, release helper and resource tests
        run: node --test scripts/audit/*.test.mjs scripts/contracts/*.test.mjs scripts/quality/*.test.mjs scripts/release/*.test.mjs site/assets/__tests__/*.spec.js
      - name: Script and built-in skill helper contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*_contracts.py' -v
      - name: Install terminal tooling dependencies
        run: npm --prefix tools/tui-lab ci --no-audit --no-fund
      - name: TUI Lab unit and ownership contracts
        run: npm --prefix tools/tui-lab test

  gateway-desktop:
    name: Gateway, Electron and E2E harness contracts
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      COREPACK_ENABLE_AUTO_PIN: '0'
      pnpm_config_verify_deps_before_run: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: gateway-owned-cli
      - name: Build actual CLI used by account and protocol fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config xvfb imagemagick
          cargo build --locked -p kcoder_cli --bin kcoder
      - name: Install locked Gateway dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile
      - name: Gateway and desktop module tests
        run: npm --prefix apps/kcoder-studio test
      - name: E2E harness, registration and cleanup contracts
        run: npm --prefix apps/kcoder-studio run test:e2e:harness

  python-runtime:
    name: Python desktop, account and deployment helpers
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-owned-cli
      - name: Install actual CLI for isolated Unix account fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          cargo build --locked -p kcoder_cli --bin kcoder
          # These ephemeral runner paths must satisfy the same production trust guard.
          sudo chown root:root /usr/local /usr/local/bin
          sudo chmod 755 /usr/local /usr/local/bin
          sudo install -m 755 target/debug/kcoder /usr/local/bin/kcoder
      - name: Desktop worker adapter unit tests
        run: python3 -m unittest discover -s scripts/computer-use -p 'test_*.py' -v
      - name: Install owned loopback SSH fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
      - name: Account, Wiki worker and deployment contracts
        run: sudo env "PATH=$PATH" KCODER_TEST_SYSTEM_USERS=1 python3 -m unittest discover -s scripts/install/tests -p 'test_*.py' -v

  provider-sdk:
    name: Vendored model SDK unit contracts
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/genai -> target
          key: provider-sdk
      - name: Actual SDK library tests without external provider calls
        run: cargo test --manifest-path third_party/genai/Cargo.toml --lib

  windows-scripts:
    name: PowerShell syntax and installation transactions
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse every tracked PowerShell script without executing it
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0 -or $scripts.Count -eq 0) { throw 'No tracked PowerShell scripts found' }
          $invalid = @()
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $invalid += "$script`: $($parseErrors | Out-String)" }
          }
          if ($invalid.Count) { throw ($invalid -join "`n") }
          Write-Output "PowerShell syntax: $($scripts.Count) files passed"
      - name: Owned temporary installation and rollback contracts
        run: ./scripts/tests/windows-package-transaction.ps1

  android-native:
    name: Android native compilation
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'full' || inputs.tier == 'android'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/kcoder-studio/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install locked Mobile dependencies and terminal WebView
        run: |
          npm --prefix apps/kcoder-studio/mobile ci --no-audit --no-fund
          npm --prefix apps/kcoder-studio/mobile run build:terminal-webview
      - name: Generate Android project from actual Expo configuration
        working-directory: apps/kcoder-studio/mobile
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Compile actual unsigned debug application
        working-directory: apps/kcoder-studio/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64

  platform-preflight:
    name: Validate protected desktop prerequisites
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'platform'
    runs-on: ubuntu-24.04
    environment: protected-platform-tests
    outputs:
      labels: ${{ steps.target.outputs.labels }}
      suite: ${{ steps.target.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require an explicitly configured owned runner
        id: target
        env:
          TARGET: ${{ inputs.platform_target }}
          RUNNERS: ${{ vars.KCODER_PLATFORM_RUNNERS_JSON }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          const targets = {
            'linux-desktop': 'tauri-native-file-read',
            'macos-desktop': 'tauri-native-file-read',
            'windows-desktop': 'windows-computer-use',
          };
          const mapping = JSON.parse(process.env.RUNNERS || '{}');
          const labels = mapping[process.env.TARGET];
          if (!targets[process.env.TARGET] || !Array.isArray(labels) || !labels.includes('self-hosted') ||
              labels.some(label => typeof label !== 'string' || !/^[A-Za-z0-9._-]+$/.test(label))) {
            throw new Error('Configure KCODER_PLATFORM_RUNNERS_JSON with owned self-hosted labels for this target');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `labels=${JSON.stringify(labels)}\nsuite=${targets[process.env.TARGET]}\n`);
          EOF

  platform:
    name: Protected native desktop acceptance
    needs: platform-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'platform'
    runs-on: ${{ fromJSON(needs.platform-preflight.outputs.labels) }}
    environment: protected-platform-tests
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
      KCODER_E2E_KCODER_BIN: ${{ vars.KCODER_E2E_KCODER_BIN }}
      KCODER_E2E_TAURI_BIN: ${{ vars.KCODER_E2E_TAURI_BIN }}
      KCODER_E2E_PACKAGED_DIR: ${{ vars.KCODER_E2E_PACKAGED_DIR }}
      KCODER_E2E_REQUIRE_CHROMIUM_SANDBOX: '1'
      pnpm_config_verify_deps_before_run: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked desktop verification dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile
          pnpm --dir apps/kcoder-studio/renderer exec playwright install chromium
      - name: Owned real desktop fixture and cleanup
        shell: bash
        env:
          SUITE: ${{ needs.platform-preflight.outputs.suite }}
        run: node apps/kcoder-studio/e2e/run-all.mjs --model-independent --suite "$SUITE"
      - name: Upload bounded native acceptance records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.platform_target }}-records
          path: |
            target/test/apps/kcoder-studio/e2e/**/manifest.json
            target/test/apps/kcoder-studio/e2e/**/result.json
          if-no-files-found: ignore
          retention-days: 5

  benchmarks:
    name: Explicit offline performance benchmarks
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
      - name: Install credential-store build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Only explicitly named offline benchmarks
        run: cargo test -p kcoder_engine -p kcoder_memory -p kcoder_repl --lib benchmark -- --ignored --nocapture --test-threads=1

  studio-frontend:
    name: Studio frontend
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: Asia/Shanghai
      COREPACK_ENABLE_AUTO_PIN: '0'
      pnpm_config_verify_deps_before_run: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node22-studio-pnpm-${{ hashFiles('apps/kcoder-studio/pnpm-lock.yaml', 'apps/kcoder-studio/renderer/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node22-studio-pnpm-
      - name: Install locked frontend dependencies
        run: |
          # Renderer contracts import Gateway modules; no native host build runs here.
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile
      - name: TypeScript
        run: pnpm --dir apps/kcoder-studio/renderer typecheck
      - name: Lint, typography and task lifecycle
        run: pnpm --dir apps/kcoder-studio/renderer lint
      - name: Renderer and shared chat unit tests
        run: |
          mkdir -p target/ci/frontend
          pnpm --dir apps/kcoder-studio/renderer exec vitest run --maxWorkers=2 --reporter=json --outputFile="$GITHUB_WORKSPACE/target/ci/frontend/studio-vitest.json"
      - name: Production renderer build
        run: pnpm --dir apps/kcoder-studio/renderer build
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-test-report
          path: target/ci/frontend/studio-vitest.json
          if-no-files-found: ignore
          retention-days: 5

  mobile-frontend:
    name: Mobile Web frontend
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/kcoder-studio/mobile/package-lock.json
      - name: Install locked Mobile dependencies
        run: npm --prefix apps/kcoder-studio/mobile ci --no-audit --no-fund
      - name: Build terminal WebView and check TypeScript
        run: npm --prefix apps/kcoder-studio/mobile run typecheck
      - name: Mobile unit tests
        run: |
          mkdir -p target/ci/frontend
          npm --prefix apps/kcoder-studio/mobile test -- --maxWorkers=2 --reporter=json --outputFile="$GITHUB_WORKSPACE/target/ci/frontend/mobile-vitest.json"
      - name: Production Mobile Web build
        run: npm --prefix apps/kcoder-studio/mobile run build:web
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-frontend-test-report
          path: target/ci/frontend/mobile-vitest.json
          if-no-files-found: ignore
          retention-days: 5

  file-size:
    name: Source file size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/quality/check-file-size.test.mjs
      - run: node scripts/quality/check-file-size.mjs --strict

  skills:
    name: Skills system gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux credential-store build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Core skill behavior tests
        run: cargo test -p kcoder_specs --test core_skills

      - name: Skill store transaction and process tests
        run: cargo test -p kcoder_skills

      - name: Skill lifecycle and safety tests
        run: cargo test -p kcoder_tools skill_

      - name: Core skill pressure integration tests
        run: cargo test -p kcoder_engine core_skill_pressure

      - name: Skill activation integration test
        run: cargo test -p kcoder_engine skill_tool_activation_updates_next_provider_request_and_usage

  rust:
    name: Rust quality gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript and TUI browser test dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          npm --prefix apps/kcoder-relay ci --no-audit --no-fund
          pnpm --dir apps/kcoder-studio install --frozen-lockfile
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile
          npm --prefix tools/tui-lab ci
          npm --prefix tools/tui-lab exec -- playwright install --with-deps chromium

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            ripgrep

      - name: Audit scripts selftest
        run: scripts/audit/audit_scripts_selftest.sh

      - name: Release packaging contract
        run: scripts/release/test-packaging-contract.sh

      - name: Generated public contract compatibility
        run: |
          node scripts/contracts/generate.mjs --check
          node --test scripts/contracts/contracts.test.mjs
          pnpm --dir apps/kcoder-studio/renderer exec tsc -p ../../../scripts/contracts/tsconfig.json

      - name: Embedded plugin guidance integrity
        run: cargo test -p kcoder_plugins --lib bundled

      - name: Secret and history scan
        run: scripts/audit/audit_release_check.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Review exact Linux ignored test roster
        run: python3 scripts/ci/check_quality_contracts.py --check-ignored

      - name: Project PR test matrix
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: cargo run -p kcoder_test_runner -- --tier pr --keep-going

      - name: Docs
        run: cargo doc --workspace --no-deps

      - name: Release build
        run: cargo build --release --all-features

  full:
    name: Nightly/full matrix
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'full')
    runs-on: ubuntu-latest
    env:
      KCODER_E2E_CHROMIUM_NO_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install full-tier system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install JavaScript and browser dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          npm --prefix apps/kcoder-relay ci --no-audit --no-fund
          pnpm --dir apps/kcoder-studio install --frozen-lockfile
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile
          npm --prefix tools/tui-lab ci
          npm --prefix tools/tui-lab exec -- playwright install --with-deps chromium
          pnpm --dir apps/kcoder-studio/renderer exec playwright install --with-deps chromium

      - name: Run full matrix
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: cargo run -p kcoder_test_runner -- --tier full --keep-going

  real-model:
    name: Protected real-model matrix
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'real-model'
    runs-on: ubuntu-latest
    environment: protected-tests
    env:
      KCODER_E2E_REAL_MODEL: "1"
      KCODER_E2E_MODEL_PROFILE: ${{ vars.KCODER_E2E_MODEL_PROFILE }}
      KCODER_E2E_MODEL_ENDPOINT: ${{ vars.KCODER_E2E_MODEL_ENDPOINT }}
      KCODER_E2E_MODEL_NAME: ${{ vars.KCODER_E2E_MODEL_NAME }}
      KCODER_E2E_MODEL_API_FORMAT: ${{ vars.KCODER_E2E_MODEL_API_FORMAT }}
      KCODER_E2E_MODEL_CREDENTIAL_ENV: ${{ vars.KCODER_E2E_MODEL_CREDENTIAL_ENV }}
      KCODER_E2E_MODEL_CREDENTIAL_VALUE: ${{ secrets.KCODER_E2E_MODEL_CREDENTIAL_VALUE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --dir apps/kcoder-studio install --frozen-lockfile
          pnpm --dir apps/kcoder-studio/renderer install --frozen-lockfile

      - name: Materialize minimal protected Provider configuration
        run: |
          export KCODER_CONFIG_DIR="$RUNNER_TEMP/kcoder-real-model-config"
          echo "KCODER_CONFIG_DIR=$KCODER_CONFIG_DIR" >> "$GITHUB_ENV"
          install -d -m 700 "$KCODER_CONFIG_DIR"
          node --input-type=module <<'EOF'
          import { writeFile } from "node:fs/promises";
          const profile = process.env.KCODER_E2E_MODEL_PROFILE;
          const endpoint = process.env.KCODER_E2E_MODEL_ENDPOINT;
          const model = process.env.KCODER_E2E_MODEL_NAME;
          const apiFormat = process.env.KCODER_E2E_MODEL_API_FORMAT;
          const credentialEnv = process.env.KCODER_E2E_MODEL_CREDENTIAL_ENV;
          if (!/^[A-Za-z0-9._-]+$/.test(profile || "")) throw new Error("protected environment must define a valid KCODER_E2E_MODEL_PROFILE");
          if (!endpoint || !model || !["anthropic_messages", "openai_chat_completions", "openai_responses"].includes(apiFormat)) throw new Error("protected environment is missing endpoint/model/api format");
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(credentialEnv || "") || !process.env.KCODER_E2E_MODEL_CREDENTIAL_VALUE) throw new Error(`protected environment is missing the credential for ${profile}`);
          const settings = { active_provider: profile, providers: { [profile]: {
            credential_env: [credentialEnv], api_format: apiFormat, endpoint,
            default_model: model, discover_models: false, context_window_tokens: 131072,
            output_headroom_tokens: 4096, max_output_tokens: 4096, request_timeout_secs: 120,
            no_proxy: false, extra_body: {},
          } } };
          await writeFile(`${process.env.KCODER_CONFIG_DIR}/settings.json`, `${JSON.stringify(settings, null, 2)}\n`, { mode: 0o600 });
          EOF

      - name: Verify configuration through the real CLI
        run: |
          export "$KCODER_E2E_MODEL_CREDENTIAL_ENV=$KCODER_E2E_MODEL_CREDENTIAL_VALUE"
          cargo build -p kcoder_cli --bin kcoder
          target/debug/kcoder --cwd "$GITHUB_WORKSPACE" config get providers > /dev/null
          target/debug/kcoder --cwd "$RUNNER_TEMP" --json auth status | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>{if(!JSON.parse(text).providers.some(row=>row.id===process.env.KCODER_E2E_MODEL_PROFILE&&row.configured))process.exit(1)})'

      - name: Run real-model matrix
        run: |
          export "$KCODER_E2E_MODEL_CREDENTIAL_ENV=$KCODER_E2E_MODEL_CREDENTIAL_VALUE"
          cargo run -p kcoder_test_runner -- --tier real-model --consent real-model --keep-going

      - name: MiniMax three-protocol and TUI acceptance
        if: env.KCODER_E2E_MODEL_NAME == 'MiniMax-M3'
        run: |
          export "$KCODER_E2E_MODEL_CREDENTIAL_ENV=$KCODER_E2E_MODEL_CREDENTIAL_VALUE"
          npm --prefix tools/tui-lab ci
          npm --prefix tools/tui-lab exec -- playwright install --with-deps chromium
          node apps/kcoder-studio/e2e/run-all.mjs --real-model --suite real-model-protocol-matrix

  # No live external-provider test entrypoint is registered in the default matrix.
  # Retire this dispatch/job until a real suite and protected prerequisites exist.
  # The runner still supports consent-gated external-provider suites in custom matrices.

  windows-portable:
    name: Windows portable Rust and contracts
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'full'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and configure Windows process supervisor
        shell: pwsh
        run: |
          cargo build -p kcoder_process_supervisor --bin kcoder-process-supervisor
          if ($LASTEXITCODE -ne 0) { throw "failed to build Windows process supervisor" }
          $supervisor = (Resolve-Path "target/debug/kcoder-process-supervisor.exe").Path
          "KCODER_PROCESS_SUPERVISOR_BIN=$supervisor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KCODER_E2E_PROCESS_SUPERVISOR_BIN=$supervisor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Native Windows process supervisor acceptance
        run: cargo test -p kcoder_process_supervisor --all-targets -- --test-threads=1

      - name: Native Windows Specs process adapter acceptance
        run: cargo test -p kcoder_specs windows_adapter -- --test-threads=1

      - name: Native Windows Specs bounded command owner
        run: |
          cargo test -p kcoder_specs process::tests:: -- --test-threads=1

      - name: Portable Rust harness and runner
        run: cargo test -p kcoder_test_harness -p kcoder_test_runner

      - name: Actual CLI and Gateway dependencies for Windows harness fixtures
        shell: pwsh
        run: |
          cargo build --locked -p kcoder_cli --bin kcoder
          if ($LASTEXITCODE -ne 0) { throw "failed to build fixture CLI" }
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw "Corepack setup failed" }
          corepack prepare pnpm@11.24.0 --activate
          if ($LASTEXITCODE -ne 0) { throw "pnpm setup failed" }
          pnpm --dir apps/kcoder-studio install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Gateway dependency installation failed" }

      - name: Windows Studio harness and nested-process cleanup
        run: npm --prefix apps/kcoder-studio run test:e2e:harness

      - name: Native CLI compile contract
        run: cargo check -p kcoder_cli --all-targets

      - name: Native CLI attachment reparse-point rejection
        run: cargo test -p kcoder_cli --bin kcoder app_server::attachments::tests::windows_reparse_replacement_fails_materialization_without_reading_outside -- --exact

      - name: Native CLI attachment owner lock contract
        run: cargo test -p kcoder_cli --bin kcoder app_server::attachments::tests::attachment_owner_os_lock_survives_peer_scavenging_and_releases_after_crash -- --exact

      - name: Native CLI private artifact capability and ACL contract
        run: cargo test -p kcoder_cli --bin kcoder app_server::private_files::tests -- --test-threads=1

      - name: Native Windows plugin store transaction and DACL contract
        run: cargo test -p kcoder_plugins store::tests::local_install_update_and_uninstall_preserve_data_by_default -- --exact --test-threads=1

      - name: Native Windows plugin reparse-point and hard-link rejection
        run: cargo test -p kcoder_plugins store::copy::windows_tests::secure_copy_rejects_windows_reparse_points_and_hard_links -- --exact --test-threads=1

      - name: Native Windows skill store lock replace and recovery
        run: cargo test -p kcoder_skills -- --test-threads=1

  specs-process-darwin:
    name: Specs process ownership (${{ matrix.architecture }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test native process ownership
        run: |
          cargo test -p kcoder_specs process::tests:: -- --test-threads=1
          cargo test -p kcoder_skills -- --test-threads=1

  specs-process-bsd:
    name: Specs process ownership (${{ matrix.system }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: FreeBSD
            operating_system: freebsd
            version: "15.1"
            host_triple: x86_64-unknown-freebsd
            toolchain_source: rust-dist
          # DragonFly BSD 6.4.2 DPorts does not provide a verifiable native Rust 1.95
          # toolchain. Retain x86_64-unknown-dragonfly cfg for environments that have
          # one, but mark it unsupported and exclude it from completion gates until a verifiable native source exists.
          - system: OpenBSD
            operating_system: openbsd
            version: "7.9"
            host_triple: x86_64-unknown-openbsd
            toolchain_source: openbsd-snapshot
          - system: NetBSD
            operating_system: netbsd
            version: "10.1"
            host_triple: x86_64-unknown-netbsd
            toolchain_source: rust-dist
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start native BSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.operating_system }}
          version: ${{ matrix.version }}
          architecture: x86-64
          shell: bash
          memory: 6G
          cpu_count: 2

      - name: Stage signed OpenBSD snapshot upgrade
        if: matrix.toolchain_source == 'openbsd-snapshot'
        run: sudo sysupgrade -s -n

      - name: Reboot into the OpenBSD snapshot
        if: matrix.toolchain_source == 'openbsd-snapshot'
        shell: bash
        run: cpa.sh --reboot

      - name: Install and verify native Rust 1.95+
        run: |
          case "${{ matrix.toolchain_source }}" in
            rust-dist)
              archive="rust-1.95.0-${{ matrix.host_triple }}.tar.xz"
              curl --fail --location --retry 3 \
                --output "$archive" \
                "https://static.rust-lang.org/dist/$archive"
              tar -xJf "$archive"
              "${archive%.tar.xz}/install.sh" \
                --prefix="$HOME/.kcoder-rust-1.95" \
                --without=rust-docs
              export PATH="$HOME/.kcoder-rust-1.95/bin:$PATH"
              ;;
            openbsd-snapshot)
              # OpenBSD 7.9 release ships Rust 1.94.1 and Rust does not publish
              # Tier-3 host archives, so explicitly select the signed snapshot package.
              sudo pkg_add -Dsnap -I -u rust || sudo pkg_add -Dsnap -I rust
              ;;
            *) echo "unsupported Rust toolchain source" >&2; exit 1 ;;
          esac
          rust_version="$(rustc --version | awk '{print $2}')"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          awk -F. -v version="$rust_version" 'BEGIN {
            split(version, parts, ".");
            if (parts[1] < 1 || (parts[1] == 1 && parts[2] < 95)) exit 1;
          }'
          test "$rust_host" = "${{ matrix.host_triple }}"
          cargo --version
          rustc -vV
          cargo test -p kcoder_specs process::tests:: -- --test-threads=1
