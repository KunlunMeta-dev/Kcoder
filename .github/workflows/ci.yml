      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install full-tier system dependencies
        run: |
