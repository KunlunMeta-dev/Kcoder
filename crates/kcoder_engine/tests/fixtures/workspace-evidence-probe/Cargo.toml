[package]
name = "kcoder-workspace-evidence-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.102"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
libc = "=0.2.186"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
