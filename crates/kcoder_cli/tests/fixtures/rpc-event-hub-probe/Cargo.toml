[package]
name = "kcoder-rpc-event-hub-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.102"
async-trait = "=0.1.89"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "sync", "macros", "io-util", "time"] }
tokio-util = "=0.7.18"
tracing = "=0.1.44"
uuid = { version = "=1.23.5", features = ["v4"] }
kcoder_app_protocol = { path = "../../../../kcoder_app_protocol" }
kcoder_types = { path = "../../../../kcoder_types" }
