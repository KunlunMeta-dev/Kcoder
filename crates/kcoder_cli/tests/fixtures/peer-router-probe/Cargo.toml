[package]
name = "kcoder-peer-router-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
kcoder_app_protocol = { path = "../../../../kcoder_app_protocol" }
kcoder_config = { path = "../../../../kcoder_config" }
kcoder_host_transport = { path = "../../../internal/host_transport" }
kcoder_types = { path = "../../../../kcoder_types" }
kcoder_state = { path = "../../../../kcoder_state" }
dunce = "1.0"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.48", features = ["macros", "rt", "time"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1
incremental = false
