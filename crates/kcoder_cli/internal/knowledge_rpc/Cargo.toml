[package]
name = "kcoder_knowledge_rpc"
description = "Target-side Wiki catalog, archive RPC and durable job execution."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
futures = { workspace = true }
kcoder_api = { path = "../../../kcoder_api" }
kcoder_app_protocol = { path = "../../../kcoder_app_protocol" }
kcoder_cli_commands = { path = "../cli_commands" }
kcoder_config = { path = "../../../kcoder_config" }
kcoder_knowledge = { path = "../../../kcoder_knowledge" }
kcoder_native_scope = { path = "../native_scope" }
kcoder_state = { path = "../../../kcoder_state" }
kcoder_tools = { path = "../../../kcoder_tools" }
kcoder_types = { path = "../../../kcoder_types" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(target_os = \"linux\")".dependencies]
chrono = { workspace = true }
libc = { workspace = true }

[lib]
path = "../../src/internal/knowledge_rpc/lib.rs"
