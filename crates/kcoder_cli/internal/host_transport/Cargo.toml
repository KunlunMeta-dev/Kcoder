[package]
name = "kcoder_host_transport"
description = "Bounded JSON-RPC and supervised native host transport."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[features]
test-oracle = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
kcoder_app_protocol = { path = "../../../kcoder_app_protocol" }
kcoder_app_rpc_codec = { path = "../../../kcoder_app_protocol/internal/app_rpc_codec" }
kcoder_config = { path = "../../../kcoder_config" }
kcoder_native_scope = { path = "../native_scope" }
kcoder_process_supervisor = { path = "../../../kcoder_process_supervisor" }
kcoder_types = { path = "../../../kcoder_types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(windows)".dependencies]
sha2 = { workspace = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[lib]
path = "../../src/internal/host_transport/lib.rs"
