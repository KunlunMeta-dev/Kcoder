[package]
name = "kcoder_browser"
description = "Owned Chromium sessions and authenticated browser profile catalog."
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "../../src/app_server/browser.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
futures.workspace = true
kcoder_app_protocol = { path = "../../../kcoder_app_protocol" }
kcoder_app_rpc_codec = { path = "../../../kcoder_app_protocol/internal/app_rpc_codec" }
kcoder_config = { path = "../../../kcoder_config" }
kcoder_host_transport = { path = "../host_transport" }
kcoder_native_scope = { path = "../native_scope" }
kcoder_process_supervisor = { path = "../../../kcoder_process_supervisor" }
kcoder_state = { path = "../../../kcoder_state" }
kcoder_types = { path = "../../../kcoder_types" }
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio-util.workspace = true
