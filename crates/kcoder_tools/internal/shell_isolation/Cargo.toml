[package]
name = "kcoder_shell_isolation"
description = "Shell sandbox policy, platform enforcement, and environment snapshots."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
test-oracle = []

[dependencies]
anyhow.workspace = true
dirs.workspace = true
kcoder_config = { path = "../../../kcoder_config" }
kcoder_state = { path = "../../../kcoder_state" }
kcoder_types = { path = "../../../kcoder_types" }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows-sys = { version = "0.61.2", features = [
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[lib]
path = "../../src/internal/shell_isolation/lib.rs"
