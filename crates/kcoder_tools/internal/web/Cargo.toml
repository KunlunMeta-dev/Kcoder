[package]
name = "kcoder_web"
description = "Web access policy, search contracts and provider protocols."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

[features]
test-oracle = []

[dependencies]
kcoder_tool_error = { path = "../tool_error" }
async-trait = { workspace = true }
chrono = { workspace = true }
kcoder_types = { path = "../../../kcoder_types" }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
kcoder_config = { path = "../../../kcoder_config" }
tokio-util = { workspace = true }
base64 = "0.22"
html-escape = "0.2"
regex = { workspace = true }
schemars = "0.8"
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[target."cfg(target_os = \"macos\")".dependencies]
system-configuration = "0.7.0"

[lib]
path = "../../src/internal/web/lib.rs"
