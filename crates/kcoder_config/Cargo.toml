[package]
name = "kcoder_config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Opt-in downstream tests only; no production env switch or default feature.
private-file-test-hooks = ["kcoder_fs/private-file-test-hooks"]
provider-test-fixtures = []

[dependencies]
kcoder_fs = { path = "internal/fs" }
keyring.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zeroize = "1"
url = { workspace = true }
http = "1"
percent-encoding = "2"
jsonc-parser = { workspace = true }
jsonschema = { workspace = true }
serde_ignored = "0.1"
anyhow = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
globset = { workspace = true }
fs2 = "0.4"
chrono.workspace = true
kcoder_types = { path = "../kcoder_types" }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
kcoder_process_supervisor = { path = "../kcoder_process_supervisor" }
