[package]
name = "kcoder_state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
resource-pressure-tests = []

[dependencies]
kcoder_config = { path = "../kcoder_config" }
kcoder_integration_storage = { path = "internal/integration_storage" }
kcoder_types = { path = "../kcoder_types" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
fs2 = "0.4"
futures-timer = "3.0.4"
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
dunce = { workspace = true }
rusqlite = { workspace = true, features = ["limits"] }
sqlite-vfs = { workspace = true }
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = { workspace = true }
kcoder_config = { path = "../kcoder_config", features = ["private-file-test-hooks"] }
